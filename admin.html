<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>홈페이지 관리 | 에너지정보처리연구실</title>
<link rel="icon" href="assets/img/logos/favicon.png">
<style>
html,body{margin:0;height:100%;background:#F4F7F8;font-family:'Noto Sans KR',system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden}
iframe.ok{visibility:visible}
.wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#1D2760;font-size:15px;text-align:center;padding:0 24px}
.wait a{color:#1F7A6B;font-size:14px}
.alt{position:fixed;left:28px;bottom:6px;z-index:2;font-size:11px;color:#8F9BC8;text-decoration:none}
.alt:hover{color:#FFFFFF;text-decoration:underline}
@media (max-width:820px){.alt{left:auto;bottom:auto;right:12px;top:14px;color:#8F9BC8}}
</style>
</head>
<body>
<!--
  관리자 페이지(Google Apps Script)를 이 사이트 안에 띄워 Google 안내 띠를 숨깁니다.
  휴대폰 브라우저(아이폰 사파리, 카카오톡 등)는 다른 사이트 안에 들어간 Google 로그인을 막아 401 이 나므로,
  관리자 화면이 "열렸다"는 신호를 보내오지 않으면 자동으로 Google 주소로 직접 이동합니다.
-->
<div class="wait" id="wait">관리자 화면을 여는 중…<a id="go" href="#" target="_top">계속 안 열리면 여기를 누르세요</a></div>
<iframe id="f" title="홈페이지 관리"></iframe>
<a class="alt" id="alt" href="#" target="_top" hidden>안 열리면 여기 ↗</a>
<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbyoMLqbDYz_oT131k6zgm1seYkNvoy2-viidlSvNokEQOlJDMcqoEf2CvJerCFEu_Mf5Q/exec';
var f = document.getElementById('f'), ready = false, timer = null;
document.getElementById('go').href = document.getElementById('alt').href = EXEC;
function direct() { if (!ready) location.replace(EXEC); }
window.addEventListener('message', function (e) {
  if (e.data !== 'eil-admin-ready' || !/(^https:\/\/script\.google\.com$|\.googleusercontent\.com$)/.test(e.origin)) return;
  ready = true; clearTimeout(timer);
  f.className = 'ok'; document.getElementById('wait').hidden = true; document.getElementById('alt').hidden = false;
});
// 화면이 다 불러와졌는데 신호가 없으면(401·로그인 막힘) 곧바로 직접 열기
f.addEventListener('load', function () { clearTimeout(timer); timer = setTimeout(direct, 6000); });
timer = setTimeout(direct, 25000);
f.src = EXEC;
</script>
</body>
</html>
